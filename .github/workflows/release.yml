name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    # ビルドに macOS 26 SDK と Swift 6.2 が要る。
    runs-on: macos-26
    # 公証の待ち (Makefile の notarytool --timeout) を丸ごと収める。
    timeout-minutes: 45

    env:
      # keychain には import した 1 枚しか入らないので、codesign が識別名を
      # 解決するには種別だけで足りる。
      SIGN_IDENTITY: "Developer ID Application"

    defaults:
      run:
        # 既定の `bash -e` は pipefail を立てないため、パイプ左辺の失敗が
        # 空文字として下流に流れる。
        shell: bash

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version

      # 整数 3 つの形に限る。CFBundleVersion はこれより緩い値も受けるが、v0.1.4 の
      # ドットを落とした v0.14 は 0.14 として cask に載り、次に出す版を brew が
      # 降格とみなす。形だけを見るので、版の大小は確かめていない。
      - name: Check the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "タグ $GITHUB_REF_NAME が x.y.z の形をしていません" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      # 鍵は runner 限りの keychain に置く。後始末は runner の破棄に任せる。
      - name: Import the signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          p12="$RUNNER_TEMP/certificate.p12"
          # 途中で落ちても復号した鍵を残さない。
          trap 'rm -f "$p12"' EXIT
          (umask 077; printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$p12")
          security create-keychain -p "$keychain_password" "$keychain"
          # 既定では数分で自動ロックされ、その後の codesign が鍵を引けなくなる。
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          # codesign が確認を求めずに鍵を使えるようにする。
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          # 取り違えた secret でも import 自体は通る。1 枚に定まらなければ
          # codesign が識別名を解決できないので、署名に入る前に弾く。
          found="$(security find-identity -v -p codesigning "$keychain" |
            grep -cF "$SIGN_IDENTITY" || true)"
          if [ "$found" != "1" ]; then
            echo "$SIGN_IDENTITY の鍵が $found 枚あります (1 枚であるべき)" >&2
            exit 1
          fi

      - name: Build and notarize the distribution zip
        id: dist
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          export NOTARY_KEY
          trap 'rm -f "$NOTARY_KEY"' EXIT
          # umask は復号だけに掛ける。step 全体に効かせると、この後 make が作る
          # .app のパーミッションまで 700/600 に落ち、それが zip に載る。
          (umask 077; printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$NOTARY_KEY")
          make notarize VERSION="$VERSION" SIGN_IDENTITY="$SIGN_IDENTITY"
          echo "path=$(make -s dist-path VERSION="$VERSION")" >> "$GITHUB_OUTPUT"

      # リリースの公開は取り消せないので、secrets と tap の実在は公開より前に確かめる。
      - uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: gin0606
          repositories: homebrew-tap

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: gin0606/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          path: tap

      # 同じタグでやり直せるようにする。既に公開されている asset は差し替えず
      # その digest を採る。ditto の zip は mtime を含むので再ビルドすると
      # digest が変わり、差し替えると公開物と cask がずれる。
      - name: Publish the release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.dist.outputs.path }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          name="$(basename "$ZIP")"
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          if grep -qxF "$name" <<<"$assets"; then
            # 公開済みの zip をそのまま採るので、中身が今の commit と一致している
            # 保証が要る。失敗した回の再実行 (run_attempt > 1) なら同じ commit だが、
            # タグを張り直した回はここで古い zip を配ることになるので落とす。
            if [ "$RUN_ATTEMPT" = "1" ]; then
              echo "$name は既に公開されている。再実行ではないので中止する" >&2
              exit 1
            fi
            gh release download "$GITHUB_REF_NAME" --pattern "$name" --dir published
            published="published/$name"
          elif gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP"
            published="$ZIP"
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" --generate-notes
            published="$ZIP"
          fi
          sha256="$(shasum -a 256 "$published" | cut -d ' ' -f 1)"
          if ! grep -qE '^[0-9a-f]{64}$' <<<"$sha256"; then
            echo "$published の sha256 を取れませんでした" >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Point the cask at the release
        working-directory: tap
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.publish.outputs.sha256 }}
          ASSET_NAME: ${{ steps.publish.outputs.name }}
        run: |
          sed -i '' \
            -e "s/^  version \".*\"\$/  version \"$VERSION\"/" \
            -e "s/^  sha256 \".*\"\$/  sha256 \"$SHA256\"/" \
            Casks/ediro.rb
          if ! grep -q "^  version \"$VERSION\"\$" Casks/ediro.rb ||
             ! grep -q "^  sha256 \"$SHA256\"\$" Casks/ediro.rb; then
            echo "Casks/ediro.rb の version / sha256 を書き換えられませんでした" >&2
            exit 1
          fi
          # url は sed で触らないので、配布物名との結合はここで見る。
          if ! sed "s/#{version}/$VERSION/g" Casks/ediro.rb | grep -qF "/$ASSET_NAME\""; then
            echo "Casks/ediro.rb の url が配布物名 $ASSET_NAME と一致しません" >&2
            exit 1
          fi
          if git diff --quiet -- Casks/ediro.rb; then
            echo "Casks/ediro.rb は既にこのリリースを指している"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit Casks/ediro.rb -m "Update ediro cask to $GITHUB_REF_NAME"
          # 同じ tap を gw のリリースも書くので、間に入られていたら載せ直す。
          git pull --rebase
          git push
